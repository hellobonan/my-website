<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="A warm hello from Bonan.">
  <title>Hello — I’m Bonan</title>
  <style>
    :root {
      color-scheme: dark;
      --ink: #f8f1e7;
      --muted: #b9b0a7;
      --accent: #ff7455;
      --accent-soft: #ffb35c;
      --night: #12110f;
      --line: rgb(248 241 231 / 14%);
    }

    * {
      box-sizing: border-box;
    }

    html {
      min-width: 320px;
      background: var(--night);
    }

    body {
      min-height: 100svh;
      margin: 0;
      overflow: hidden;
      color: var(--ink);
      font-family: Inter, "Helvetica Neue", Arial, sans-serif;
      background:
        radial-gradient(circle at 76% 23%, rgb(255 116 85 / 20%), transparent 27rem),
        radial-gradient(circle at 22% 88%, rgb(255 179 92 / 9%), transparent 25rem),
        var(--night);
    }

    body::before {
      position: fixed;
      inset: 0;
      z-index: -1;
      content: "";
      opacity: 0.2;
      pointer-events: none;
      background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 160 160' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='.9' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)' opacity='.18'/%3E%3C/svg%3E");
    }

    .shell {
      display: grid;
      grid-template-rows: auto 1fr auto;
      width: min(100%, 100rem);
      min-height: 100svh;
      padding: clamp(1.5rem, 4vw, 3.5rem);
      margin: 0 auto;
    }

    header,
    footer {
      display: flex;
      align-items: center;
      justify-content: space-between;
      color: var(--muted);
      font-size: 0.72rem;
      font-weight: 600;
      letter-spacing: 0.18em;
      text-transform: uppercase;
    }

    .mark {
      display: inline-grid;
      width: 2.5rem;
      aspect-ratio: 1;
      place-items: center;
      border: 1px solid var(--line);
      border-radius: 50%;
      color: var(--ink);
      letter-spacing: 0;
    }

    .status {
      display: flex;
      gap: 0.65rem;
      align-items: center;
    }

    .status::before {
      width: 0.45rem;
      height: 0.45rem;
      border-radius: 50%;
      background: #8dd994;
      box-shadow: 0 0 0 0.3rem rgb(141 217 148 / 10%);
      content: "";
    }

    main {
      display: grid;
      align-content: center;
      padding: clamp(4rem, 10vh, 8rem) 0;
    }

    .eyebrow {
      display: flex;
      gap: 1rem;
      align-items: center;
      margin: 0 0 1.5rem;
      color: var(--accent-soft);
      font-size: 0.72rem;
      font-weight: 700;
      letter-spacing: 0.2em;
      text-transform: uppercase;
      animation: rise 700ms 100ms both;
    }

    .eyebrow::before {
      width: 2.5rem;
      height: 1px;
      background: currentColor;
      content: "";
    }

    h1 {
      max-width: 11ch;
      margin: 0;
      font-family: Georgia, "Times New Roman", serif;
      font-size: clamp(4.5rem, 12.5vw, 12rem);
      font-weight: 400;
      letter-spacing: -0.07em;
      line-height: 0.78;
      text-wrap: balance;
      animation: rise 800ms 180ms both;
    }

    h1 em {
      color: var(--accent);
      font-weight: 400;
    }

    .intro {
      display: grid;
      grid-template-columns: minmax(0, 1fr) minmax(16rem, 28rem);
      gap: 2rem;
      align-items: end;
      margin-top: clamp(2.75rem, 6vw, 5rem);
      animation: rise 800ms 280ms both;
    }

    .intro::before {
      height: 1px;
      background: var(--line);
      content: "";
    }

    .intro p {
      margin: 0;
      color: var(--muted);
      font-family: Georgia, "Times New Roman", serif;
      font-size: clamp(1.1rem, 1.8vw, 1.45rem);
      line-height: 1.55;
    }

    .intro strong {
      color: var(--ink);
      font-weight: 400;
    }

    footer {
      padding-top: 1.5rem;
      border-top: 1px solid var(--line);
    }

    footer span:last-child {
      color: var(--ink);
    }

    @keyframes rise {
      from {
        opacity: 0;
        transform: translateY(1.25rem);
      }
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    @media (max-width: 650px) {
      .intro {
        grid-template-columns: 1fr;
      }

      .intro::before {
        width: 3rem;
        background: var(--accent);
      }

      footer span:first-child {
        display: none;
      }
    }

    @media (prefers-reduced-motion: reduce) {
      *,
      *::before,
      *::after {
        scroll-behavior: auto !important;
        animation-duration: 0.01ms !important;
        animation-iteration-count: 1 !important;
      }
    }
  </style>
</head>
<body>
  <div class="shell">
    <header>
      <span class="mark" aria-label="Bonan">B.</span>
      <span class="status">Nice to meet you</span>
    </header>

    <main>
      <p class="eyebrow">A small introduction</p>
      <h1>Hello, I’m <em>Bonan.</em></h1>
      <div class="intro">
        <p>
          Welcome to my corner of the internet — a simple place to
          <strong>say hello</strong> and start something interesting.
        </p>
      </div>
    </main>

    <footer>
      <span>Made with curiosity</span>
      <span>© 2026</span>
    </footer>
  </div>
</body>
</html>
